paths:
  data_dir: data
  library_dir: library
  reports_dir: reports
  logs_dir: logs

universe:
  source: sp500
  max_tickers: 500
  extra_tickers: []
  include_forex: false

data:
  years: 12
  interval: 1d
  min_bars: 500
  batch_size: 25
  batch_sleep_s: 5
  refresh_hours: 20

backtest:
  entry_price: next_open
  cost_bps_per_side: 5
  slippage_bps_per_side: 5
  stop_before_target_if_both_hit: true
  oos_fraction: 0.30
  horizons: [1, 3, 5, 10, 20]
  min_trades_total: 100
  max_variants_per_strategy: 30

verdict:
  min_oos_trades: 60
  min_t_stat: 2.0
  fdr_alpha: 0.10
  min_sector_agreement: 0.6

throttle:
  worker_threads: 2
  max_cpu_percent: 50
  duty_sleep_seconds: 0.5
  active_hours: null          # e.g. "22:00-10:00"
  pause_if_user_active: false
  pause_if_processes: []
  min_battery_percent: 30
  require_ac_power: false
  max_temp_c: 82

llm:
  host: "http://localhost:11434"
  model: "qwen2.5:3b"
  temperature: 0.2
  keep_alive: "30s"
  timeout_s: 120
  max_retries: 3
  enabled: true

orchestrator:
  heartbeat_s: 60
  idle_poll_seconds: 300
  max_new_strategies_per_cycle: 3
